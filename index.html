<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Constelly — daily constellation puzzle</title>
  <meta name="description" content="Connect the stars to reveal a hidden picture. A free new constellation puzzle every day — no login, no download.">
  <link rel="canonical" href="https://playconstelly.com/">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#0b1026">
  <link rel="manifest" href="site.webmanifest">

  <!-- Link previews (WhatsApp, iMessage, Slack, X, Facebook…). Image: tools/make_icons.py -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Constelly">
  <meta property="og:url" content="https://playconstelly.com/">
  <meta property="og:title" content="Constelly — daily constellation puzzle">
  <meta property="og:description" content="Connect the stars to reveal a hidden picture. A new puzzle every day.">
  <meta property="og:image" content="https://playconstelly.com/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Constelly: numbered stars being joined into a paper plane on a night sky.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="css/style.css">
  <!-- TODO (step 7): AdSense script + cookie consent go here, loaded only after consent. -->
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" class="icon-btn" type="button" data-label="menu.button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <h1 class="logo">Constelly <span id="puzzle-num" class="puzzle-num"></span></h1>
    <button id="stats-btn" class="icon-btn" type="button" data-label="stats.button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg>
    </button>
  </header>

  <noscript><p class="reveal">Constelly needs JavaScript to run — please enable it and reload.</p></noscript>

  <main class="stage">
    <!-- Shown when playing an earlier day from "Past puzzles" (?n=N). -->
    <p id="archive-bar" class="archive-bar" hidden>
      <span id="archive-label"></span><span id="archive-today"> · <a href="./" data-text="archive.backToToday"></a></span>
    </p>
    <div class="hud">
      <span id="timer">0:00</span>
      <!-- The puzzle's clue: hints at the picture without naming it (puzzle.clue, optional). -->
      <p id="clue" class="clue" hidden></p>
      <button id="hint-btn" type="button">Hint</button>
    </div>
    <!-- The board: dots + lines are drawn into this SVG by js/render.js.
         Portrait 3:4, viewBox 1000 × 1333: puzzle coords (x 0–1, y 0–4/3) map as coord*1000. -->
    <div class="board-wrap">
      <svg id="board" viewBox="0 0 1000 1333" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="Puzzle board"></svg>
    </div>
    <div id="controls" class="controls">
      <button id="eraser-btn" type="button" aria-pressed="false" aria-label="Eraser" title="Eraser">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.2 3.8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 18h7v2H8.5l-4.7-4.7a2 2 0 0 1 0-2.8zM6.3 13.9 10 17.6l.4.4H12l2-2-4.6-4.6z"/></svg>
      </button>
      <button id="undo-btn" type="button" aria-label="Undo" title="Undo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.6 0-5 1-6.9 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 20.1 16l2.4-.8A10.5 10.5 0 0 0 12.5 8z"/></svg>
      </button>
      <button id="reset-btn" type="button" disabled>Start over</button>
    </div>
    <p id="reveal" class="reveal" hidden></p>
    <div class="solved-actions">
      <button id="results-btn" class="link-btn" type="button" data-text="results.openButton" hidden></button>
      <button id="replay-btn" class="link-btn" type="button" data-text="results.replay" hidden></button>
    </div>
  </main>

  <!-- Sidebar menu (slides in from the left). -->
  <dialog id="menu" class="dialog drawer" aria-labelledby="menu-heading">
    <form method="dialog" class="dialog-close-form">
      <button class="dialog-close" data-label="close">&times;</button>
    </form>
    <h2 id="menu-heading">Constelly</h2>
    <nav class="menu-list">
      <a class="menu-item" id="menu-today" href="./" data-text="menu.today"></a>
      <button class="menu-item" id="menu-past" type="button" data-text="menu.past"></button>
      <button class="menu-item" id="menu-help" type="button" data-text="menu.help"></button>
      <button class="menu-item" id="menu-stats" type="button" data-text="menu.stats"></button>
      <a class="menu-item menu-item--small" href="privacy.html" data-text="menu.privacy"></a>
    </nav>
  </dialog>

  <!-- Past puzzles: filled in by js/main.js from storage.archiveRows. -->
  <dialog id="past" class="dialog" aria-labelledby="past-heading">
    <form method="dialog" class="dialog-close-form">
      <button class="dialog-close" data-label="close">&times;</button>
    </form>
    <h2 id="past-heading" data-text="past.heading"></h2>
    <p class="past-note" data-text="past.note"></p>
    <ol id="past-list" class="past-list"></ol>
  </dialog>

  <dialog id="confirm-reset" class="confirm">
    <form method="dialog">
      <p>Clear all your lines and start over? The timer keeps running.</p>
      <div class="confirm-actions">
        <button value="cancel">Cancel</button>
        <button value="reset" class="danger">Start over</button>
      </div>
    </form>
  </dialog>

  <!-- Results: filled in by js/main.js (copy in js/strings.js). -->
  <dialog id="results" class="dialog" aria-labelledby="results-heading">
    <form method="dialog" class="dialog-close-form">
      <button class="dialog-close" data-label="close">&times;</button>
    </form>
    <h2 id="results-heading"></h2>
    <p id="results-title" class="results-title"></p>
    <dl class="figures">
      <div><dt data-text="results.time"></dt><dd id="results-time"></dd></div>
      <div><dt data-text="results.hints"></dt><dd id="results-hints"></dd></div>
    </dl>
    <p id="results-replay" class="results-replay" hidden></p>
    <button id="share-btn" class="primary-btn" type="button" data-text="results.share" autofocus></button>
    <p id="share-status" class="share-status" role="status" aria-live="polite"></p>
    <p class="results-next" id="results-next"></p>
    <button id="results-replay-btn" class="link-btn" type="button" data-text="results.replay"></button>
  </dialog>

  <dialog id="help" class="dialog dialog--text" aria-labelledby="help-heading">
    <form method="dialog" class="dialog-close-form">
      <button class="dialog-close" data-label="close">&times;</button>
    </form>
    <h2 id="help-heading" data-text="help.heading"></h2>
    <div class="help-layout">
      <div id="help-body"></div>
      <!-- Tutorial animation (tools/make_tutorial_gif.py). Beside the text on wide screens, below
           it on phones; a still frame replaces it for prefers-reduced-motion. alt set from strings. -->
      <picture class="help-demo">
        <!-- src/srcset are filled in when the dialog first opens (main.js), so the 220 KB animation
             isn't downloaded by visitors who never look at it. -->
        <source data-srcset="img/tutorial-still.png" media="(prefers-reduced-motion: reduce)">
        <img id="help-demo-img" data-src="img/tutorial.gif" width="400" height="400" alt="">
      </picture>
    </div>
    <form method="dialog"><button class="primary-btn" data-text="help.close" autofocus></button></form>
    <p class="dialog-links"><a href="privacy.html" data-text="help.privacy"></a></p>
  </dialog>

  <dialog id="stats" class="dialog" aria-labelledby="stats-heading">
    <form method="dialog" class="dialog-close-form">
      <button class="dialog-close" data-label="close">&times;</button>
    </form>
    <h2 id="stats-heading" data-text="stats.heading"></h2>
    <dl class="figures figures--stats">
      <div><dt data-text="stats.solved"></dt><dd id="stat-solved"></dd></div>
      <div><dt data-text="stats.streak"></dt><dd id="stat-streak"></dd></div>
      <div><dt data-text="stats.maxStreak"></dt><dd id="stat-max-streak"></dd></div>
      <div><dt data-text="stats.avgTime"></dt><dd id="stat-avg"></dd></div>
      <div><dt data-text="stats.bestTime"></dt><dd id="stat-best"></dd></div>
      <div><dt data-text="stats.avgHints"></dt><dd id="stat-avg-hints"></dd></div>
    </dl>
    <button id="stats-today" class="primary-btn" type="button" data-text="stats.viewToday" hidden></button>
    <p class="dialog-links"><button id="stats-past" class="link-btn" type="button" data-text="menu.past"></button></p>
  </dialog>

  <footer class="footer">
    <!-- Reserved for step 7 (ads / cookie settings link). -->
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
